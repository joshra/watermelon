<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#497a59">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="西瓜遊戲">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>西瓜遊戲</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="西瓜遊戲">
      <section class="info-panel" aria-label="遊戲資訊">
        <header class="brand-card">
          <p class="eyebrow">Fruit Merge Puzzle</p>
          <h1>西瓜遊戲</h1>
          <p class="brand-copy">把一樣的水果一路養大，別讓果堆在危險線上停太久。</p>
          <div class="feature-pills" aria-label="遊戲特色">
            <span>11 種水果</span>
            <span>桌機手機都能玩</span>
            <span>離線可玩</span>
          </div>
        </header>

        <section class="topbar" aria-label="目前狀態">
          <div class="score-block">
            <span class="label">分數</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="fruit-status">
            <div class="fruit-pill">
              <span class="label">目前</span>
              <img id="currentFruitImg" alt="" width="44" height="44">
              <strong id="currentFruitName">櫻桃</strong>
            </div>
            <div class="fruit-pill">
              <span class="label">下一顆</span>
              <img id="nextFruitImg" alt="" width="44" height="44">
              <strong id="nextFruitName">草莓</strong>
            </div>
          </div>
          <div class="actions">
            <button id="pauseBtn" type="button">暫停</button>
            <button id="restartBtn" type="button">重開</button>
            <button id="soundBtn" type="button" aria-pressed="true">音效開</button>
          </div>
        </section>

        <p class="hint-card">滑鼠或手指移動位置後點一下投放。P 暫停，R 重開，F 全螢幕。</p>
      </section>

      <section class="play-column">
        <section class="play-wrap" aria-label="遊戲區">
          <canvas id="gameCanvas" width="480" height="720"></canvas>
          <div id="messagePanel" class="message-panel">
            <h1 id="messageTitle">準備開始</h1>
            <p id="messageText">移動位置後投放水果</p>
            <button id="primaryBtn" type="button">開始</button>
          </div>
        </section>
      </section>
    </main>

    <script src="vendor/matter.min.js"></script>
    <script src="game.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        const serviceWorkerVersion = "suika-game-pwa-v9";
        const hadServiceWorkerController = Boolean(navigator.serviceWorker.controller);
        let refreshingForNewServiceWorker = false;

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadServiceWorkerController || refreshingForNewServiceWorker) return;
          refreshingForNewServiceWorker = true;
          window.location.reload();
        });

        window.addEventListener("load", async () => {
          try {
            const registration = await navigator.serviceWorker.register(
              `./sw.js?v=${serviceWorkerVersion}`,
            );
            const activateWaitingWorker = () => {
              if (registration.waiting) {
                registration.waiting.postMessage({ type: "SKIP_WAITING" });
              }
            };

            registration.addEventListener("updatefound", () => {
              const worker = registration.installing;
              if (!worker) return;
              worker.addEventListener("statechange", () => {
                if (worker.state === "installed" && navigator.serviceWorker.controller) {
                  activateWaitingWorker();
                }
              });
            });

            activateWaitingWorker();
            registration.update().catch(() => {});
            document.addEventListener("visibilitychange", () => {
              if (!document.hidden) registration.update().catch(() => {});
            });
          } catch {
            // The game remains playable without PWA registration.
          }
        });
      }
    </script>
  </body>
</html>
